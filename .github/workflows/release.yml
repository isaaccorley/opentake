name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install dependencies
        run: bun ci

      - name: Verify release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -p "require('./package.json').version")"
          test "$package_version" = "$release_version"

      - name: Run static and unit gates
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test unpacked extension
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Package extension
        run: |
          chromium="opentake-${GITHUB_REF_NAME}-chromium.zip"
          firefox="opentake-${GITHUB_REF_NAME}-firefox.zip"
          (cd dist && zip -qr "../$chromium" .)
          (cd dist-firefox && zip -qr "../$firefox" .)
          sha256sum "$chromium" > "$chromium.sha256"
          sha256sum "$firefox" > "$firefox.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chromium="opentake-${GITHUB_REF_NAME}-chromium.zip"
          firefox="opentake-${GITHUB_REF_NAME}-firefox.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$chromium" "$chromium.sha256" \
            "$firefox" "$firefox.sha256" \
            --verify-tag \
            --generate-notes \
            --title "OpenTake $GITHUB_REF_NAME"
