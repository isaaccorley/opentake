name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Verify release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -p "require('./package.json').version")"
          test "$package_version" = "$release_version"

      - name: Run static and unit gates
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test unpacked extension
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Package extension
        run: |
          artifact="opentake-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -qr "../$artifact" .)
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="opentake-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
            --verify-tag \
            --generate-notes \
            --title "OpenTake $GITHUB_REF_NAME"
