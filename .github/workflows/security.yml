name: Security

on:
  schedule:
    - cron: '23 15 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/**
      - bun.lock
      - package.json

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Audit high-severity vulnerabilities
        run: bun audit --audit-level=high

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Lint workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          uvx --from zizmor==1.29.0 zizmor \
            --strict-collection --min-severity=medium --format=json . \
            | jq -e 'length == 0'
