name: Bug report
description: Report a reproducible OpenTake failure.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real recordings or private browsing data. Use synthetic media when possible.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 16
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste errors or logs only after removing sensitive data.
